schemaVersion: 1
guard:
  directories:
    repository:
      - carriers
      - carriers/*
      - carriers/electron/src/capsule
      - carriers/electron/tests/capsule
      - apps
      - packages
      - apps/*
      - packages/*
      - node_modules
      - .artifacts
      - .state
      - .github
      - .github/workflows
      - carriers/electron/tests/distribution
      - carriers/electron/tests/resources
  components:
    - packages/components
runtime:
  appid: io.perish.opendesignslim
  carrier: 1
  channel: stable
  name: Open Design Slim
  namespace: slim
  scheme: od
  version: 0.1.0
pipeline:
  carrier: carriers/electron
  capsule: carriers/electron
  daemon: apps/daemon
  web: apps/web
  outputs:
    capsule: dist/capsule
  blobs:
    probe: carriers/electron/dist/capsule/probe.bin

serve:
  data: .state/serve
  sources:
    web:
      directory: apps/web/dist
    seed:
      directory: .artifacts/seed
