schemaVersion: 1
guard:
  directories:
    repository:
      - apps
      - packages
      - apps/*
      - packages/*
      - node_modules
      - .artifacts
      - .state
      - .github
      - .github/workflows
  components:
    - packages/components
runtime:
  appid: io.perish.opendesignslim
  carrier: 1
  channel: stable
  name: Open Design Slim
  namespace: slim
  scheme: od
  version: 0.1.0
pipeline:
  carrier: apps/electron
  capsule: apps/capsule
  daemon: apps/daemon
  web: apps/web
  blobs:
    probe: apps/capsule/dist/probe.bin

serve:
  data: .state/serve
  sources:
    web:
      directory: apps/web/dist
    seed:
      directory: .artifacts/seed
